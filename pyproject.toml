[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-message-purger"
version = "0.1.0"
description = "Десктопное приложение с GUI для удаления собственных сообщений пользователя на выбранном Discord-сервере."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Discord Message Purger Contributors" },
]
keywords = ["discord", "gui", "pyside6", "messages", "purger"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
]

# Runtime-зависимости приложения.
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
]

# Опциональные зависимости разработки: тесты, property-based тестирование,
# моки HTTP и заморозка времени. Устанавливаются командой `pip install -e .[dev]`.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "respx>=0.21",
    "freezegun>=1.5",
]

[project.urls]
Homepage = "https://example.com/discord-message-purger"
Source = "https://example.com/discord-message-purger"

[project.scripts]
discord-message-purger = "discord_message_purger.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"discord_message_purger" = ["py.typed"]

# Конфигурация запуска тестов.
# Маркеры:
#   property    — property-based тесты на основе Hypothesis;
#   integration — интеграционные тесты, выполняющие сценарии end-to-end;
#   slow        — медленные тесты, исключаются из быстрых прогонов.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "property: property-based тесты на основе Hypothesis",
    "integration: интеграционные тесты, проверяющие сценарии end-to-end",
    "slow: медленные тесты, требующие много времени или ресурсов",
]
